    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chandhana Shoe Mart | Premium Footwear &amp; Online Store</title>
    <meta name="description" content="Step into style with Chandhana Shoe Mart. Discover men's, women's, kids' footwear from VKC Pride, Walkaroo, Paragon, Sparx and more." />
    <meta name="theme-color" content="#5B21B6" />

    <!-- Open Graph / WhatsApp Social Preview Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chandhana Shoe Mart" />
    <meta property="og:title" content="Chandhana Shoe Mart | Premium Footwear &amp; Online Store" />
    <meta property="og:description" content="Official Chandhana Shoe Mart - Tagarapuvalasa. Discover genuine footwear from VKC Pride, Walkaroo, Paragon, Sparx and more at factory-direct prices." />
    <meta property="og:image" content="https://www.chandhanashoemart.com/csm_original_logo.png" />
    <meta property="og:image:secure_url" content="https://www.chandhanashoemart.com/csm_original_logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="https://www.chandhanashoemart.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chandhana Shoe Mart | Premium Footwear" />
    <meta name="twitter:description" content="Official Chandhana Shoe Mart - Tagarapuvalasa. Discover genuine footwear at factory-direct prices." />
    <meta name="twitter:image" content="https://www.chandhanashoemart.com/csm_original_logo.png" />

    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CSMART" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Vite Chunk Error & Service Worker Self-Healing -->
    <script>
      // Automatically reload if a new deployment changed chunk hashes
      window.addEventListener('vite:preloadError', function () {
        window.location.reload();
      });

      // Register and auto-update Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            reg.update();
          }).catch(function () {});
        });
      }
    </script>
  </head>
  <body class="bg-white text-slate-900 font-sans antialiased selection:bg-[#E9D5FF] selection:text-[#4C1D95] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
